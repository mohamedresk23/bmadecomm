name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bmadecomm_dev
          POSTGRES_PASSWORD: 4TIismGz0_s3Zj2PsT4P6lhT2AL2Vt1W6pWtLbhp5lo
          POSTGRES_DB: bmadecomm_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://bmadecomm_dev:4TIismGz0_s3Zj2PsT4P6lhT2AL2Vt1W6pWtLbhp5lo@127.0.0.1:5432/bmadecomm_dev"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check for secrets
        run: |
          # Basic check of tracked files only; this is not a full secret scanner.
          scan_status=0
          git grep -i -I -l -e '[p]assword=' -- . || scan_status=$?
          if [ "$scan_status" -eq 0 ]; then
            echo "Potential secrets found in the files listed above."
            exit 1
          elif [ "$scan_status" -ne 1 ]; then
            echo "Secret check failed to run."
            exit "$scan_status"
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke Test
        run: |
          npm run start &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if RESPONSE=$(curl -sf http://127.0.0.1:3000/api/health); then
              echo "Health check succeeded: $RESPONSE"
              kill $SERVER_PID || true
              exit 0
            fi
            sleep 1
          done
          echo "Health check timed out after 30 seconds"
          kill $SERVER_PID || true
          exit 1

