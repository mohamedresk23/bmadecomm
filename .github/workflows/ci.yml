name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check for secrets
        run: |
          # Basic check of tracked files only; this is not a full secret scanner.
          scan_status=0
          git grep -i -I -l -e '[p]assword=' -- . || scan_status=$?
          if [ "$scan_status" -eq 0 ]; then
            echo "Potential secrets found in the files listed above."
            exit 1
          elif [ "$scan_status" -ne 1 ]; then
            echo "Secret check failed to run."
            exit "$scan_status"
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck || echo "Typecheck step needs configuration"

      - name: Build
        run: npm run build
